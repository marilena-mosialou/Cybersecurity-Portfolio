title: Suspicious Remote Authentication Activity
id: 4d1b1b9f-1f4f-4b18-9d31-remote-auth-correlation
status: experimental
description: Detects repeated remote network authentication activity across multiple hosts associated with potential lateral movement or unauthorized remote access behavior.
author: Marilena Mosialou
date: 2026/05/19
references:
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - attack.t1078

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID:
      - 4624
      - 4625
    LogonType: 3

  condition: selection

falsepositives:
  - Legitimate remote administration
  - Vulnerability scanners
  - Enterprise management tools
  - Backup infrastructure

level: medium
